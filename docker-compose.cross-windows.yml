services:
  windows-cross:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/docker/cross/windows/alpine.Dockerfile
      args:
        ALPINE_VERSION: "3.24.2"
        TARGET_TRIPLE: x86_64-w64-mingw32
      target: alpine-cross
    image: openfpgaloader-windows-cross:alpine-3.24.2
    working_dir: /src
    # Explicit command makes Compose robust even if a future Dockerfile stage
    # refactor accidentally drops CMD from the selected build target.
    command: ["bash", "/src/deploy/scripts/docker-cross-windows.sh"]
    volumes:
      # Mount the repository exactly once. Package output lives below /src/dist.
      # act on Docker Desktop may override CROSS_HOST_SRC with a daemon-visible
      # /host_mnt/<drive>/... or /run/desktop/mnt/host/<drive>/... path.
      - ${CROSS_HOST_SRC:-.}:/src
      - openfpgaloader-cross-cache:/root/.cache
      - openfpgaloader-cross-work:/work
    environment:
      # Keep write-heavy CMake/Ninja output off the Windows/9p bind mount.
      BUILD_DIR: /work/build-docker-windows
      PREFIX_DIR: /work/install
      PACKAGE_DIR: /src/dist/docker-windows
      TMPDIR: /work/tmp
      CMAKE_BUILD_TYPE: Release
      CMAKE_EXTRA_ARGS: "-DENABLE_UDEV=OFF -DENABLE_LIBGPIOD=OFF -DENABLE_OPTIM=OFF"

  windows-cross-driver:
    extends: windows-cross
    image: openfpgaloader-windows-cross-driver:alpine-3.24.2
    build:
      context: .
      dockerfile: deploy/docker/cross/windows/alpine.Dockerfile
      args:
        ALPINE_VERSION: "3.24.2"
        TARGET_TRIPLE: x86_64-w64-mingw32
        XPCU_DRIVER_ARCHIVE: externals/xilinx-usb-driver/dist/xilinx-platform-cable-windows.zip
      target: cross-with-driver

volumes:
  openfpgaloader-cross-cache:
  openfpgaloader-cross-work:
