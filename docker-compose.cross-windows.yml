services:
  windows-cross:
    # The image is Alpine Linux with a MinGW cross-toolchain. Docker Desktop
    # must therefore be running its Linux container engine.
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/docker/cross/windows/alpine.Dockerfile
      args:
        ALPINE_VERSION: edge
        TARGET_TRIPLE: x86_64-w64-mingw32
    image: openfpgaloader-windows-cross:alpine
    pull_policy: build
    working_dir: /src
    volumes:
      # Host-side source/output paths. Defaults work on Linux CI runners and
      # when compose is invoked directly from the host. When the compose
      # command itself runs inside a container (e.g. act on Docker Desktop for
      # Windows), the daemon cannot see the container's /mnt/<drive> paths and
      # silently mounts an empty directory; set CROSS_HOST_SRC / CROSS_HOST_OUT
      # to paths visible to the Docker daemon, e.g.
      #   CROSS_HOST_SRC=/host_mnt/d/openFPGALoader
      #   CROSS_HOST_OUT=/host_mnt/d/openFPGALoader/dist/docker-windows
      - ${CROSS_HOST_SRC:-.}:/src
      - ${CROSS_HOST_OUT:-./dist/docker-windows}:/out
      - openfpgaloader-cross-cache:/root/.cache
    environment:
      BUILD_DIR: /src/build-docker-windows
      PREFIX_DIR: /src/dist/docker-windows/install
      PACKAGE_DIR: /out
      CMAKE_BUILD_TYPE: Release
      CMAKE_EXTRA_ARGS: "-DENABLE_UDEV=OFF -DENABLE_LIBGPIOD=OFF -DENABLE_OPTIM=OFF"

volumes:
  openfpgaloader-cross-cache:
