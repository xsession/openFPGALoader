site_name: openFPGALoader
site_description: Universal utility for programming FPGAs
site_url: https://xsession.github.io/openFPGALoader/
repo_name: xsession/openFPGALoader
repo_url: https://github.com/xsession/openFPGALoader
edit_uri: edit/master/docs/
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - tables
  - toc:
      permalink: true
plugins:
  - search
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js
nav:
  - Home: index.md
  - Getting started:
      - Quick start: guide/quickstart.md
      - Installation: guide/install.md
      - Usage tutorial: guide/usage.md
      - Advanced usage: guide/advanced-usage.md
      - CLI reference: guide/cli-reference.md
      - Troubleshooting: guide/troubleshooting.md
  - How it works:
      - Overview: how-it-works/overview.md
      - JTAG transport: how-it-works/jtag-transport.md
      - Flash programming: how-it-works/flash-programming.md
      - SPI-over-JTAG bridges: how-it-works/spi-over-jtag.md
      - Direct SPI, DFU, and XVC: how-it-works/alternate-paths.md
  - Hardware:
      - Xilinx / AMD: hardware/xilinx.md
      - Lattice: hardware/lattice.md
      - Intel / Altera: hardware/intel-altera.md
      - Gowin: hardware/gowin.md
      - Efinix: hardware/efinix.md
      - Anlogic: hardware/anlogic.md
      - Cologne Chip: hardware/colognechip.md
      - XCF Platform Flash PROMs: hardware/xcf-platform-flash.md
  - Compatibility:
      - Boards: compatibility/boards.md
      - FPGAs: compatibility/fpgas.md
      - Cables: compatibility/cables.md
  - Field notes:
      - SPI-over-JTAG source review: debug/soj-review.md
      - SOJ v2 RDID alignment: debug/soj-v2-rdid-alignment.md
      - Xilinx Platform Cable USB:
          - Technical reproduction: debug/xpcu/technical-reproduction.md
          - Windows debug report: debug/xpcu/windows-debug-report.md
          - Windows setup: debug/xpcu/windows-setup.md
          - Cable driver deployment: debug/xpcu/cable-driver-deployment.md
          - Cable driver troubleshooting: debug/xpcu/cable-driver-troubleshooting.md
      - Spartan-6 XPCU SPI investigation: debug/spartan6-xpcu-spi-investigation.md
      - Spartan-6 HS3 M25P40 write stall: debug/spartan6-hs3-m25p40-write-stall.md
      - Digilent HS3 vs XPCU dump path: debug/digilent-hs3-vs-xpcu-dump-flash.md
      - MachXO3 recovery after bulk erase: debug/machxo3-recovery-after-bulk-erase.md
  - Development:
      - Architecture:
