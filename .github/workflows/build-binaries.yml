name: Build multi-platform binaries

'on':
  push:
    branches: [ master, main ]
    tags: [ 'v*', 'nightly-*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag/name to publish assets to, e.g. nightly or v1.1.1-custom'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04-x86_64
            runner: ubuntu-22.04
          - name: ubuntu-24.04-x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            gzip \
            libftdi1-2 \
            libftdi1-dev \
            libhidapi-dev \
            libhidapi-hidraw0 \
            libhidapi-libusb0 \
            libudev-dev \
            pkg-config \
            tree \
            zlib1g-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_OPTIM=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Smoke test
        run: |
          ./build/openFPGALoader --version
          ./build/openFPGALoader --help >/dev/null
          ./build/openFPGALoader --list-boards >/dev/null
          ./build/openFPGALoader --list-cables >/dev/null

      - name: Install into staging directory
        run: |
          cmake --install build --prefix "$PWD/pkg/usr/local"
          mkdir -p "$PWD/pkg/usr/local/share/licenses/openFPGALoader"
          cp LICENSE "$PWD/pkg/usr/local/share/licenses/openFPGALoader/LICENSE"
          install -Dm644 99-openfpgaloader.rules "$PWD/pkg/etc/udev/rules.d/99-openfpgaloader.rules"
          install -Dm644 70-openfpgaloader.rules "$PWD/pkg/etc/udev/rules.d/70-openfpgaloader.rules"
          tree pkg

      - name: Create archive
        run: |
          name="openFPGALoader-${{ matrix.name }}"
          tar -C pkg -czf "${name}.tar.gz" .
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Build Debian installer
        env:
          INSTALL_DIR: ${{ github.workspace }}/pkg/usr/local
          DIST_DIR: ${{ github.workspace }}/dist
          OUTPUT_DIR: ${{ github.workspace }}/dist
          PACKAGE_NAME: openFPGALoader-${{ matrix.name }}
        run: |
          bash ./deploy/scripts/build-linux-deb.sh
          dpkg-deb --info dist/openFPGALoader-${{ matrix.name }}_*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openFPGALoader-${{ matrix.name }}
          path: |
            openFPGALoader-${{ matrix.name }}.tar.gz
            openFPGALoader-${{ matrix.name }}.tar.gz.sha256
            dist/openFPGALoader-${{ matrix.name }}_*.deb
            dist/openFPGALoader-${{ matrix.name }}_*.deb.sha256

  macos:
    name: macOS universal-ish ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-14 ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install cmake pkg-config libftdi libusb hidapi zlib gzip

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_UDEV=OFF \
            -DENABLE_LIBGPIOD=OFF \
            -DENABLE_OPTIM=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Smoke test
        run: |
          ./build/openFPGALoader --version
          ./build/openFPGALoader --help >/dev/null
          ./build/openFPGALoader --list-boards >/dev/null
          ./build/openFPGALoader --list-cables >/dev/null

      - name: Install into staging directory
        run: |
          cmake --install build --prefix "$PWD/pkg/usr/local"
          mkdir -p "$PWD/pkg/usr/local/share/licenses/openFPGALoader"
          cp LICENSE "$PWD/pkg/usr/local/share/licenses/openFPGALoader/LICENSE"

      - name: Create archive
        run: |
          arch="$(uname -m)"
          name="openFPGALoader-${{ matrix.runner }}-${arch}"
          tar -C pkg -czf "${name}.tar.gz" .
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openFPGALoader-${{ matrix.runner }}
          path: |
            openFPGALoader-${{ matrix.runner }}-*.tar.gz
            openFPGALoader-${{ matrix.runner }}-*.tar.gz.sha256

  windows-msys2:
    name: Windows MSYS2 ${{ matrix.sys }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sys: UCRT64
            env: ucrt-x86_64
          - sys: MINGW64
            env: x86_64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: >-
            git
            base-devel
            mingw-w64-${{ matrix.env }}-gcc
            mingw-w64-${{ matrix.env }}-cmake
            mingw-w64-${{ matrix.env }}-ninja
            mingw-w64-${{ matrix.env }}-pkgconf
            mingw-w64-${{ matrix.env }}-libftdi
            mingw-w64-${{ matrix.env }}-libusb
            mingw-w64-${{ matrix.env }}-hidapi
            mingw-w64-${{ matrix.env }}-zlib
            zip

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/openFPGALoader \
            -DENABLE_OPTIM=ON \
            -DENABLE_UDEV=OFF \
            -DENABLE_LIBGPIOD=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Smoke test
        run: |
          ./build/openFPGALoader.exe --version
          ./build/openFPGALoader.exe --help >/dev/null
          ./build/openFPGALoader.exe --list-boards >/dev/null
          ./build/openFPGALoader.exe --list-cables >/dev/null

      - name: Install into staging directory
        run: |
          cmake --install build --prefix "$PWD/pkg"
          mkdir -p "$PWD/pkg/share/licenses/openFPGALoader"
          cp LICENSE "$PWD/pkg/share/licenses/openFPGALoader/LICENSE"
          # Copy runtime DLLs for a portable zip. Ignore missing DLLs because fully static builds need none.
          ldd "$PWD/pkg/bin/openFPGALoader.exe" | awk '/\/mingw/ {print $3}' | while read -r dll; do cp -n "$dll" "$PWD/pkg/bin/" || true; done
          find pkg -maxdepth 3 -type f -print

      - name: Create zip
        run: |
          name="openFPGALoader-windows-${{ matrix.sys }}-x86_64"
          (cd pkg && zip -r "../${name}.zip" .)
          sha256sum "${name}.zip" > "${name}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openFPGALoader-windows-${{ matrix.sys }}-x86_64
          path: |
            openFPGALoader-windows-${{ matrix.sys }}-x86_64.zip
            openFPGALoader-windows-${{ matrix.sys }}-x86_64.zip.sha256

  windows-cross:
    name: Windows cross-compile from Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Linux cross-build image
        run: docker compose -f docker-compose.cross-windows.yml build windows-cross

      - name: Build Windows package with Compose
        run: |
          # When this job runs via `act` on Docker Desktop for Windows, the
          # workspace lives at /mnt/<drive>/... and the inner `docker compose`
          # command is resolved by the daemon inside the WSL2 VM, where the
          # host drive is mounted at /host_mnt/<drive>... . /mnt/... does not
          # exist in the VM, so the daemon would mount an empty directory and
          # the build would fail on a missing /src. Probe the remapped path
          # through the Docker socket and use it when valid. On Linux CI
          # runners the workspace never looks like /mnt/<drive>/..., so this
          # is a no-op there.
          CROSS_HOST_SRC="${GITHUB_WORKSPACE}"
          CROSS_HOST_OUT="${GITHUB_WORKSPACE}/dist/docker-windows"
          HOST_REMAPPED=0
          if [[ "${GITHUB_WORKSPACE}" =~ ^/mnt/([a-z])/(.*)$ ]]; then
            probe="/host_mnt/${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            if docker run --rm -v "${probe}:/probe" alpine:edge test -f /probe/CMakeLists.txt >/dev/null 2>&1; then
              CROSS_HOST_SRC="${probe}"
              CROSS_HOST_OUT="${probe}/dist/docker-windows"
              HOST_REMAPPED=1
            fi
          fi
          echo "Mounting repository from daemon-side path: ${CROSS_HOST_SRC}"
          export CROSS_HOST_SRC CROSS_HOST_OUT
          docker compose -f docker-compose.cross-windows.yml run --rm windows-cross
          # Under `act` on Docker Desktop the workspace is a throwaway named
          # volume (a copy of the repo), but the compose build above reads and
          # writes against the real drive through /host_mnt/.... The package
          # therefore lands on the host drive, not in this volume, so stream it
          # back into the workspace before verifying/uploading it. On Linux CI
          # runners nothing is remapped and this is a no-op.
          if (( HOST_REMAPPED == 1 )); then
            mkdir -p dist/docker-windows
            # The portable package is always named
            # openFPGALoader-windows-x86_64-<ver>.zip, so these globs never match
            # the XPCU driver archive (xilinx-platform-cable-windows.zip) that
            # may also sit in the directory. BusyBox tar (alpine) rejects
            # --null/-print0, so use plain globs. || true keeps a missing-file
            # case from aborting under set -e; the count check below reports it.
            docker run --rm -v "${CROSS_HOST_OUT}:/host_out" alpine:edge \
              sh -c 'cd /host_out && tar -cf - openFPGALoader-windows-x86_64-*.zip openFPGALoader-windows-x86_64-*.zip.sha256 2>/dev/null' \
              > pkg.tar || true
            if [[ -s pkg.tar ]]; then
              # Drop any stale copy from a previous run so exactly one package
              # remains, then extract the freshly built one.
              rm -f dist/docker-windows/openFPGALoader-windows-x86_64-*.zip \
                    dist/docker-windows/openFPGALoader-windows-x86_64-*.zip.sha256
              tar -xf pkg.tar -C dist/docker-windows
            fi
            rm -f pkg.tar
          fi
          shopt -s nullglob
          packages=(dist/docker-windows/openFPGALoader-windows-x86_64-*.zip)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one cross-compiled Windows ZIP, found ${#packages[@]}" >&2
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          cp "${packages[0]}" openFPGALoader-windows-cross-x86_64.zip
          sha256sum openFPGALoader-windows-cross-x86_64.zip > openFPGALoader-windows-cross-x86_64.zip.sha256
          unzip -l openFPGALoader-windows-cross-x86_64.zip

      # Upload the package for the downstream windows-installer job. This only
      # makes sense on GitHub, where the runner injects ACTIONS_RUNTIME_TOKEN
      # (required by upload-artifact@v7). Under `act` there is no such token and
      # the action aborts; ACT=true is set by `act` and never by GitHub, so skip
      # the upload locally. The ZIP is still built and left on the host drive.
      - name: Upload artifact
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openFPGALoader-windows-cross-x86_64
          path: |
            openFPGALoader-windows-cross-x86_64.zip
            openFPGALoader-windows-cross-x86_64.zip.sha256

  windows-xpcu-drivers:
    name: Build Xilinx Platform Cable driver package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build libwdi and XPCU driver package
        run: bash ./externals/xilinx-usb-driver/docker-build.sh

      - name: Verify Windows driver artifact
        run: |
          test -s externals/xilinx-usb-driver/dist/xilinx-platform-cable-windows.zip
          test -s externals/xilinx-usb-driver/dist/xilinx-platform-cable-windows.zip.sha256
          unzip -l externals/xilinx-usb-driver/dist/xilinx-platform-cable-windows.zip

      - name: Upload XPCU driver artifact
        uses: actions/upload-artifact@v7
        with:
          name: xilinx-platform-cable-windows
          path: |
            externals/xilinx-usb-driver/dist/xilinx-platform-cable-windows.zip
            externals/xilinx-usb-driver/dist/xilinx-platform-cable-windows.zip.sha256

  windows-installer:
    name: Build Windows installer
    needs: [ windows-cross, windows-xpcu-drivers ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download portable Windows package
        uses: actions/download-artifact@v8
        with:
          name: openFPGALoader-windows-cross-x86_64
          path: cross-package

      - name: Download XPCU driver package
        uses: actions/download-artifact@v8
        with:
          name: xilinx-platform-cable-windows
          path: xpcu-driver

      - name: Assemble installer inputs
        run: |
          (cd cross-package && sha256sum -c openFPGALoader-windows-cross-x86_64.zip.sha256)
          (cd xpcu-driver && sha256sum -c xilinx-platform-cable-windows.zip.sha256)
          mkdir -p dist/docker-windows/install
          unzip -q cross-package/openFPGALoader-windows-cross-x86_64.zip \
            -d dist/docker-windows/install
          test -f dist/docker-windows/install/bin/openFPGALoader.exe
          test -s xpcu-driver/xilinx-platform-cable-windows.zip

      - name: Build Inno Setup installer
        env:
          DIST_DIR: ${{ github.workspace }}/dist/docker-windows
          INSTALL_DIR: ${{ github.workspace }}/dist/docker-windows/install
          OUTPUT_DIR: ${{ github.workspace }}/dist/docker-windows
          XPCU_DRIVER_ARCHIVE: ${{ github.workspace }}/xpcu-driver/xilinx-platform-cable-windows.zip
        run: bash ./deploy/scripts/build-windows-installer.sh

      - name: Verify installer artifact
        run: |
          shopt -s nullglob
          installers=(dist/docker-windows/*-win64-setup.exe)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one Windows installer, found ${#installers[@]}" >&2
            exit 1
          fi
          sha256sum "${installers[0]}" > "${installers[0]}.sha256"
          file "${installers[0]}"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: openFPGALoader-windows-installer
          path: |
            dist/docker-windows/*-win64-setup.exe
            dist/docker-windows/*-win64-setup.exe.sha256

  release:
    name: Publish GitHub release
    needs: [ linux, macos, windows-msys2, windows-cross, windows-xpcu-drivers, windows-installer ]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != '')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Select release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          prerelease: ${{ !startsWith(steps.tag.outputs.value, 'v') }}
          files: dist/*
